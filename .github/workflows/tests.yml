name: Django tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: davigurumi
          POSTGRES_USER: davigurumi
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U davigurumi"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_DB: davigurumi
      POSTGRES_USER: davigurumi
      POSTGRES_PASSWORD: synthetic-ci-only
      POSTGRES_HOST: localhost
      POSTGRES_SSLMODE: disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --verbosity 2

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pip-audit==2.10.1 bandit==1.9.4
      - run: pip-audit -r requirements.txt
      - run: bandit -r accounts config materials purchasing projects sales production finance operations portability pricing -ll
